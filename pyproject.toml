[project]
name = "pg-mcp"
version = "0.2.1"
description = "PostgreSQL MCP Server: natural-language questions to validated, read-only SQL over MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0,<2",
    "asyncpg>=0.30.0",
    "sqlglot>=25.0",
    "openai>=1.50.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "prometheus-client>=0.20",
    "anyio>=4.4",
]

[project.scripts]
pg-mcp = "pg_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pg_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = '-m "not integration"'
markers = [
    "integration: tests that require a live PostgreSQL and OpenAI API key (deselected by default)",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "ASYNC", # flake8-async
    "RUF", # ruff-specific
]
ignore = [
    # `__all__` lists are grouped by category comments throughout the codebase.
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
# Tests may use asserts, hardcoded test credentials, and SQL attack strings.
"tests/**" = ["S101", "S105", "S106", "S608"]
# main.py is a thin delegation stub.
"main.py" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["pg_mcp"]
